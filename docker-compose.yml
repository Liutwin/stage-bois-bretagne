services:
  frontend:
    image: ghcr.io/liutwin/locations-centre-bretagne-frontend:latest
    ports:
      - "3000:3000"
    restart: unless-stopped

  backend:
    image: ghcr.io/liutwin/locations-centre-bretagne-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  db_data:


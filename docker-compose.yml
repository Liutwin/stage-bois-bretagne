services:
  frontend:
    image: ghcr.io/liutwin/stage-bois-bretagne-frontend:latest
    ports:
      - "3001:3000"
    restart: unless-stopped

  backend:
    image: ghcr.io/liutwin/stage-bois-bretagne-backend:latest
    ports:
      - "8001:8000"
    volumes:
      - db_data:/app/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  db_data:


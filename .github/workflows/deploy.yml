name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  PROJECT_PATH: /srv/stage-bois-bretagne

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set image name lowercase
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.yml"
          target: ${{ env.PROJECT_PATH }}/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,PROJECT_PATH
          script: |
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            cd $PROJECT_PATH
            docker compose pull
            docker compose up -d

      - name: Notify client
        if: success()
        run: |
          curl -s --request POST \
            --url https://api.brevo.com/v3/smtp/email \
            --header "api-key: ${{ secrets.BREVO_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data '{
              "sender": { "name": "Liutwin", "email": "contact@stageboisbretagne.com" },
              "to": [{ "email": "${{ secrets.CLIENT_EMAIL }}", "name": "Madame Le Bras" }],
              "subject": "Mise à jour du site deployée ✓",
              "htmlContent": "<p>Bonjour,</p><p>Une nouvelle version du site <a href=\"https://stageboisbretagne.com\">stageboisbretagne.com</a> a été déployée avec succès.</p><p><strong>Modification :</strong> ${{ github.event.head_commit.message }}</p><p>Cordialement,<br>Liutwin</p>"
            }'

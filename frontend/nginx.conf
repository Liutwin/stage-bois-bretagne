server {
    listen 3000;
    server_name localhost;

    # Route admin — SPA séparée
    location /admin {
        root   /usr/share/nginx/html;
        try_files $uri /admin.html;
    }

    # Route principale — SPA publique
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
